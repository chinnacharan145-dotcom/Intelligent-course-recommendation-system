components:
  schemas:
    AcademicYear:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 50
        start_date:
          type: string
          format: date
          nullable: true
        end_date:
          type: string
          format: date
          nullable: true
        is_active:
          type: boolean
      required:
      - id
      - name
    Assessment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        questions_count:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
        assessment_type:
          $ref: '#/components/schemas/AssessmentTypeEnum'
        duration_minutes:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        total_marks:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
        passing_marks:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - passing_marks
      - questions_count
      - title
      - total_marks
      - updated_at
    AssessmentDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        questions:
          type: array
          items:
            $ref: '#/components/schemas/AssessmentQuestion'
          readOnly: true
        title:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
        assessment_type:
          $ref: '#/components/schemas/AssessmentTypeEnum'
        duration_minutes:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        total_marks:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
        passing_marks:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - passing_marks
      - questions
      - title
      - total_marks
      - updated_at
    AssessmentOption:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        option_text:
          type: string
        option_order:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
      required:
      - id
      - option_text
    AssessmentQuestion:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        skill:
          type: string
          format: uuid
        skill_name:
          type: string
          readOnly: true
        question_text:
          type: string
        question_type:
          type: string
          maxLength: 50
        marks:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        difficulty:
          $ref: '#/components/schemas/DifficultyEnum'
        question_order:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        options:
          type: array
          items:
            $ref: '#/components/schemas/AssessmentOption'
          readOnly: true
      required:
      - id
      - options
      - question_text
      - skill
      - skill_name
    AssessmentTypeEnum:
      enum:
      - DIAGNOSTIC
      - SKILL_LEVEL
      - MODULE_QUIZ
      type: string
      description: |-
        * `DIAGNOSTIC` - Diagnostic Assessment
        * `SKILL_LEVEL` - Skill Level Test
        * `MODULE_QUIZ` - Module Quiz
    Branch:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 255
        code:
          type: string
          maxLength: 50
        description:
          type: string
          nullable: true
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - code
      - created_at
      - id
      - name
      - updated_at
    BranchSubject:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        subject_details:
          allOf:
          - $ref: '#/components/schemas/Subject'
          readOnly: true
        branch_name:
          type: string
          readOnly: true
        semester_number:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          readOnly: true
        is_elective:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        branch:
          type: string
          format: uuid
        regulation:
          type: string
          format: uuid
        semester:
          type: string
          format: uuid
        subject:
          type: string
          format: uuid
      required:
      - branch
      - branch_name
      - created_at
      - id
      - regulation
      - semester
      - semester_number
      - subject
      - subject_details
    Career:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        required_skills:
          type: array
          items:
            $ref: '#/components/schemas/CareerSkill'
          readOnly: true
        name:
          type: string
          maxLength: 150
        slug:
          type: string
          maxLength: 150
          pattern: ^[-a-zA-Z0-9_]+$
        description:
          type: string
          nullable: true
        industry:
          type: string
          maxLength: 100
        salary_min:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
        salary_max:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
        job_outlook:
          type: string
          nullable: true
        typical_roles: {}
        education_requirements: {}
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - required_skills
      - slug
      - updated_at
    CareerSkill:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        skill_name:
          type: string
          readOnly: true
        required_level:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          description: Target proficiency level 0-100
        importance:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          description: Importance rating 1-5
        weight:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,2})?$
        required:
          type: boolean
        career:
          type: string
          format: uuid
        skill:
          type: string
          format: uuid
      required:
      - career
      - id
      - skill
      - skill_name
    College:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        university_name:
